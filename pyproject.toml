[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dted-coastline-stabilizer"
version = "1.1.4"
description = "QGIS tools for reviewing coastlines and stabilizing DTED elevations"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["dted_coastline_stabilizer"]

[tool.setuptools.package-data]
dted_coastline_stabilizer = ["metadata.txt", "user-guide-ko.html"]
